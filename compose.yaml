services:
  blockmate:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env first}
      DATA_DIR: /app/data
      PORT: 3000
    volumes:
      - bot-data:/app/data
    stop_grace_period: 15s
volumes:
  bot-data:
